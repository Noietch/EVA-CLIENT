<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111513">
  <title>EVA VR Input</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111513; color: #f0f3ef; }
    canvas { display: block; width: 100%; height: 100%; }
    header { position: fixed; inset: max(18px, env(safe-area-inset-top)) 20px auto 20px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 16px; pointer-events: none; }
    .brand { font-size: 16px; font-weight: 700; }
    .status-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .status { display: flex; align-items: center; gap: 8px; color: #bdc5bf; font-size: 13px; }
    .haptic-status { color: #8f9b93; font-size: 11px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d36545; }
    .dot.online { background: #5ebd87; }
    footer { position: fixed; inset: auto 20px max(20px, env(safe-area-inset-bottom)) 20px; z-index: 2; display: flex; justify-content: center; pointer-events: none; }
    button { min-height: 46px; padding: 0 18px; border: 1px solid #86918a; border-radius: 6px; background: #f0f3ef; color: #111513; font: inherit; font-weight: 700; cursor: pointer; pointer-events: auto; }
    button:disabled { cursor: default; opacity: .45; }
    button:focus-visible { outline: 3px solid #d9a441; outline-offset: 3px; }
    .error { position: fixed; left: 20px; right: 20px; bottom: 84px; z-index: 2; color: #f09a80; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <header><div class="brand">EVA VR INPUT</div><div class="status-stack"><div class="status"><span id="status-dot" class="dot"></span><span id="status">CONNECTING</span></div><div id="haptic-status" class="haptic-status">HAPTIC L:? R:?</div></div></header>
  <footer><button id="enter-vr" type="button" disabled>ENTER VR</button></footer>
  <div id="error" class="error" role="alert"></div>
  <script>
    window.addEventListener("error", () => {
      const label = document.getElementById("haptic-status");
      if (label) label.textContent = "HAPTIC JS ERROR";
    });
    window.addEventListener("unhandledrejection", () => {
      const label = document.getElementById("haptic-status");
      if (label) label.textContent = "HAPTIC JS ERROR";
    });
  </script>
  <script type="module" src="/app.js?v=haptic-diagnostics-2"></script>
</body>
</html>
