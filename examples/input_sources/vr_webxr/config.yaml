teleop:
  vr_webxr:
    label: VR
    operation: vr
    launch:
      python: .venv/bin/python
      module: examples.input_sources.vr_webxr.node
      fixed: [--token-stdin]
      parser: _parser
    settings:
      host: 127.0.0.1
      port: 43876
      public_host: ""
      tls_cert: ""
      tls_key: ""
    client:
      type: vr_webxr
      endpoint: tcp://127.0.0.1:8765
      ack_endpoint: tcp://127.0.0.1:8766
      input_timeout_s: 0.25
      heartbeat_timeout_s: 2.0
      position_scale: 1.0
      eef_filter_alpha: 1.0
      base_from_xr_rotation: [[0, 0, -1], [-1, 0, 0], [0, 1, 0]]
      gripper:
        mode: linear
        threshold: 0.6
        open_value: 1.0
        close_value: 0.0
    safety:
      max_qpos_step: 0.08
      max_position_error_m: 0.08
      max_orientation_error_rad: 0.35
