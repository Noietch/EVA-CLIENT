[project]
name = "eva-ur5e-hardware"
version = "0.1.0"
description = "Isolated runtime for the EVA UR5e hardware adapter."
requires-python = ">=3.11,<3.12"
dependencies = [
    "eva-client",
    "alicia_d_sdk",
    "pydhgripper==1.0.2",
    "synria-robocore>=2.0.0a1",
    "ur-rtde==1.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.15.9",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
eva-client = { path = "../../..", editable = true }
alicia_d_sdk = { path = "../arx_r5/SDK/alicia_d", editable = true }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
