robot:
  arx_x5:
    label: ARX X5
    defaults: {teleop: joint, camera: external}
    launch:
      python: examples/hardware/arx_x5/.venv/bin/python
      module: examples.hardware.arx_x5.node
      fixed:
      - --passive-collection
      disable_camera_option: disabled_camera
    settings:
      obs_endpoint: tcp://127.0.0.1:5555
      action_endpoint: tcp://127.0.0.1:5556
      camera_endpoint: tcp://127.0.0.1:5557
      left_can_port: can1
      right_can_port: can3
      arm_type: 2
      rate: 30
    config:
      robot:
        type: arx_x5
        initial_qpos: null
        eef_reference_frame: base_link
        gripper_threshold: null
        gripper_open: 1.0
        gripper_close: 0.0
      transport:
        type: zmq
        node_name: eva_client
        disabled_cameras: []
        disabled_groups: []
        topics: {}
      collection:
        schema:
          robot_type: arx_x5
          arms:
            left_arm: left
            right_arm: right
          cameras:
            cam_high: observation.images.cam_high
            cam_left_wrist: observation.images.cam_left_wrist
            cam_right_wrist: observation.images.cam_right_wrist
        transport:
          ros1:
            primary_camera: ''
            max_frame_skew_sec: 0.1
            groups: {}
          ros2:
            primary_camera: ''
            max_frame_skew_sec: 0.1
            groups: {}
      operator_control:
        enabled: false
        action_topic: /eva/operator_action
camera:
  x5_d405:
    separate: true
    label: RealSense D405
    robots:
    - arx_x5
    profile_field: realsense_profile_path
    profile_loader: examples.hardware.arx_x5.camera:load_realsense_color_profiles
    profile_variants:
    - profile: day
    - profile: night
    repeat:
    - realsense_camera
    profiles:
    - examples/hardware/arx_x5/d405_profile.yaml
    choices:
      realsense_profile:
      - day
      - night
    settings:
      realsense_camera:
      - cam_high=index:0
      - cam_left_wrist=index:1
      - cam_right_wrist=index:2
      realsense_resolution: 640x480
      realsense_fps: 30
      realsense_profile: day
      realsense_profile_path: examples/hardware/arx_x5/d405_profile.yaml
  none: {}
  external: {}
teleop:
  x5_leader:
    label: Alicia leaders
    robots:
    - arx_x5
    settings:
      left_alicia_port: /dev/ttyUSB0
      right_alicia_port: /dev/ttyUSB1
  joint: {}
  transport: {}
  vr_webxr:
    client:
      arms:
        left_arm:
          controller: left
        right_arm:
          controller: right
